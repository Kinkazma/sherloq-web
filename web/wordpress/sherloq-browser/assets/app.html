<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' https://use.typekit.net https://p.typekit.net; font-src 'self' https://use.typekit.net; img-src 'self' blob: data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>SHERLOQ</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="workspace-shell.css"><script type="module" src="fonts.js"></script></head>
<body><div id="startup-notice" role="status" aria-live="polite">Chargement de SHERLOQ… / Loading SHERLOQ…</div>
<div id="workspace-app" inert>
<header class="app-toolbar">
 <strong class="brand">SHERLOQ <small>Browser · <span id="app-version">0.14.3</span></small></strong>
 <details id="file-menu" class="app-menu"><summary data-label="file"></summary><div>
  <button id="open-file-menu" data-label="open"></button><button id="quick-export-image" data-label="quickExport" disabled></button><button id="export-image" data-label="exportImage" disabled></button><button id="export-report" data-label="exportReport" disabled></button><hr>
  <button id="save-session" data-label="saveSession" disabled></button><button id="restore-session" data-label="restoreSession"></button>
 </div></details>
 <button id="open-image" data-label="open"></button><button id="toggle-tools" data-label="tools" aria-pressed="true"></button>
 <div class="layout-actions" role="group" aria-label="Affichage"><button id="layout-tile" data-label="tile"></button><button id="layout-cascade" data-label="cascade"></button><button id="layout-tabs" data-label="tabs"></button><button id="close-all" data-label="closeAll"></button></div>
 <span class="toolbar-spacer"></span>
 <details id="settings-menu" class="app-menu"><summary data-label="settings"></summary><div>
  <button id="export-settings" data-label="exportSettings"></button><button id="import-settings" data-label="importSettings"></button><hr>
  <label><span data-label="compute"></span><select id="compute-profile"><option value="maximum" data-label="maximum"></option><option value="aggressive" data-label="aggressive"></option></select></label>
  <label><span data-label="navigation"></span><select id="navigation-mode"><option value="auto" data-label="automatic"></option><option value="mouse" data-label="mouse"></option><option value="trackpad">Trackpad</option></select></label>
  <label><input id="highlight-tools" type="checkbox"><span data-label="highlight"></span></label>
  <details><summary data-label="about"></summary><p><a href="https://github.com/GuidoBartoli/sherloq" target="_blank" rel="noopener">Guido Bartoli</a><br><a href="https://github.com/Kinkazma/sherloq" target="_blank" rel="noopener">Gaël Dauchy</a></p><p data-label="privacy"></p><p data-label="availability"></p></details>
 </div></details>
 <button id="language-toggle" class="theme-button">EN</button><button id="theme-toggle" class="icon-button" aria-label="Thème">◐</button><button id="fullscreen" class="icon-button" aria-label="Plein écran">⛶</button><a id="home" class="icon-button" href="/" target="_top" aria-label="Accueil">⌂</a>
</header>
<div class="workbench">
 <nav id="toolbox" aria-label="Outils"><div id="tool-tree"></div><div class="navigation-tools"><button id="fit" data-label="fit" disabled></button><button id="zoom-out" aria-label="Zoom −" disabled>−</button><output id="zoom">—</output><button id="zoom-in" aria-label="Zoom +" disabled>+</button></div></nav>
 <main class="workspace"><div id="workspace-tabs" class="tabs" role="tablist" hidden></div><div id="workspace-desk" data-layout="tabs"><div id="welcome"><strong>SHERLOQ</strong><p data-label="welcome"></p><button id="welcome-open" data-label="open"></button><small data-label="privacy"></small></div></div>
 <footer class="statusbar"><p id="workspace-status" role="status" aria-live="polite"></p><span id="background-status"></span><progress id="workspace-progress" max="1" value="0"></progress><span id="file-info"></span></footer></main>
</div></div>
<input id="image-file" type="file" accept="image/*,.jp2,.j2k,.avif,.webp,.heic,.heif,.tif,.tiff,.psd,.jxl,.bmp,.gif,.dng,.cr2,.cr3,.nef,.arw" hidden><input id="settings-file" type="file" accept="application/json,.json" hidden><input id="session-file" type="file" accept="application/json,.json" hidden>
<dialog id="close-dialog"><h2 data-label="closeAll"></h2><p data-label="closeHint"></p><div class="dialog-actions"><button id="cancel-close" data-label="cancel" autofocus></button><button id="confirm-close" data-label="closeConfirm"></button></div></dialog>
<script type="module" src="workspace-entry.js"></script></body></html>
