<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><title>SHERLOQ — ELA énergie réelle</title>
<style>body{font:15px system-ui}iframe{width:1150px;height:900px}pre{white-space:pre-wrap}</style>
<h1>ELA énergie · recette WordPress réelle</h1><button id="run">Vérifier l’énergie</button><a id="save" hidden>Télécharger la preuve</a><pre id="out">Prêt</pre>
<iframe id="app" src="/wp-content/plugins/sherloq-browser/assets/app.html?v=0.4.0&fonts=https%3A%2F%2Fuse.typekit.net%2Fwqp3eph.css#lang=fr"></iframe>
<script type="module">
const wait=ms=>new Promise(r=>setTimeout(r,ms)),check=(v,msg)=>{if(!v)throw Error(msg);};
async function until(fn){for(let i=0;i<1200;i++){if(fn())return;await wait(50);}throw Error('Timeout');}
const hex=b=>Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('');
run.onclick=async()=>{
 run.disabled=true;const proof={date:new Date().toISOString(),userAgent:navigator.userAgent,tests:[]},doc=app.contentDocument,w=app.contentWindow,$=id=>doc.getElementById(id);let calls=[],blobs=[],matrix=null;
 const post=w.Worker.prototype.postMessage,anchor=w.HTMLAnchorElement.prototype.click,create=w.URL.createObjectURL,ctx=$('canvas').getContext('2d'),draw=ctx.drawImage;
 w.Worker.prototype.postMessage=function(m,...args){calls.push({action:m.action,operation:m.payload?.operation});return post.call(this,m,...args);};w.URL.createObjectURL=function(b){blobs.push(b);return create.call(this,b);};w.HTMLAnchorElement.prototype.click=function(){if(!this.href.startsWith('blob:'))anchor.call(this);};ctx.drawImage=function(...args){const m=this.getTransform();matrix={a:m.a,d:m.d,e:m.e,f:m.f};return draw.apply(this,args);};
 const changed=(id,value)=>{$(id).value=value;$(id).dispatchEvent(new w.Event('change',{bubbles:true}));};
 const metadata=()=>JSON.parse($('provenance').textContent);
 const execute=async()=>{$('energy-run').click();await until(()=>!$('energy-run').disabled);check($('provenance').textContent,'No result: '+$('status').textContent);return metadata();};
 async function test(name,fn){try{const detail=await fn();proof.tests.push({name,pass:true,...detail});}catch(e){proof.tests.push({name,pass:false,error:e.message});throw e;}finally{out.textContent=JSON.stringify(proof,null,2);}}
 try{
 await until(()=>$('ela-mode')?.onchange);changed('ela-mode','classic');$('layout-tabs').click();await wait(100);
 await test('Original JPEG and classic ELA retained',async()=>{const file=new w.File([await (await fetch('energy-panels.jpg')).arrayBuffer()],'energy-panels.jpg',{type:'image/jpeg'});const dt=new w.DataTransfer();dt.items.add(file);$('file').files=dt.files;$('file').dispatchEvent(new w.Event('change'));await until(()=>!$('run').disabled);await until(()=>$('provenance').textContent&&!$('run').disabled);const m=metadata();check($('layer').value==='result','ELA not shown automatically');check(m.provenance.engine==='0.28.0','Unexpected locked engine');const resultPixels=ctx.getImageData(0,0,$('canvas').width,$('canvas').height).data.slice();changed('layer','source');const original=ctx.getImageData(0,0,$('canvas').width,$('canvas').height).data;check(original.some((x,i)=>x!==resultPixels[i]),'Displayed ELA equals original');changed('layer','result');return{engine:m.provenance.engine,automatic:true,displayDiffersFromOriginal:true};});
 await test('Conservative energy on original JPEG with full dimensions',async()=>{changed('ela-mode','energy');changed('energy-block','16');changed('energy-profile','standard');const m=await execute();check(m.provenance.engine==='0.28.0'&&m.provenance.operation==='ela.energy','Wrong engine');check(m.data.metadata.image_shape.join(',')==='385,513','Resized');check(m.data.metadata.energy.quantiles.join(',')==='0.01,0.99','Wrong default');check(m.data.metadata.energy.thresholds.join(',')==='5,5','Wrong deviations');return{engine:m.provenance.engine,shape:m.data.metadata.image_shape,regions:m.data.regions.length,metrics:m.metrics};});
 await test('Five exported JSON arrays equal independent native bytes',async()=>{blobs=[];$('energy-json').click();await until(()=>blobs.length>0&&!$('energy-run').disabled);const exported=JSON.parse(await blobs.at(-1).text()),reference=await(await fetch('energy-reference.json')).json(),hashes={};for(const [name,expected]of Object.entries(reference.fields)){const Type=name==='energy_labels'||name==='energy_scope'?Int32Array:Float32Array;const a=new Type(exported.data[name]);const hash=hex(await crypto.subtle.digest('SHA-256',a));check(hash===expected,'Native mismatch '+name);hashes[name]=hash;}return{hashes};});
 await test('NPZ export is produced by actual engine',async()=>{blobs=[];$('energy-npz').click();await until(()=>blobs.length>0&&!$('energy-run').disabled);const bytes=new Uint8Array(await blobs.at(-1).arrayBuffer());check(bytes[0]===80&&bytes[1]===75,'Not NPZ/ZIP');return{bytes:bytes.length,sha256:hex(await crypto.subtle.digest('SHA-256',bytes))};});
 await test('Opacity and label view reuse result and preserve camera',async()=>{$('zoom-in').click();const before={...matrix},runs=calls.filter(x=>x.action==='run').length;for(const [id,value]of [['energy-opacity','0'],['energy-view','labels'],['energy-opacity','85'],['energy-view','overlay']]){$(id).value=value;$(id).dispatchEvent(new w.Event('input',{bubbles:true}));}await until(()=>!$('energy-run').disabled);check(calls.filter(x=>x.action==='run').length===runs,'Inference reran');check(JSON.stringify(matrix)===JSON.stringify(before),'Camera changed');return{before,after:matrix,runs};});
 await test('Four values independent and cache reused after a deviation edit',async()=>{const before=['histogramLow','histogramHigh','shadow','highlight'].map(k=>Number($('energy-'+k).value));$('energy-shadow').dispatchEvent(new w.PointerEvent('pointerdown',{button:0,isPrimary:true}));$('energy-shadow').value='51';$('energy-shadow').dispatchEvent(new w.Event('input',{bubbles:true}));const after=['histogramLow','histogramHigh','shadow','highlight'].map(k=>Number($('energy-'+k).value));check(after.join(',')===[before[0],before[1],51,before[3]].join(','),'Unrelated values changed');check($('energy-profile').value==='manual','Not manual');const camera={...matrix},m=await execute();check(m.metrics.energyRecompressions===0,'JPEG repeated');check(JSON.stringify(camera)===JSON.stringify(matrix),'Run recentered');return{before,after,metrics:m.metrics};});
 await test('Adaptive Sensitive profile accepts current values',async()=>{changed('energy-profile','conservative');const m=await execute();check(m.data.metadata.energy.profile==='conservative','Profile mismatch');check(Number($('energy-shadow').value)===Math.round(m.data.metadata.energy.thresholds[0]*10),'Auto sliders not updated');return{quantiles:m.data.metadata.energy.quantiles,thresholds:m.data.metadata.energy.thresholds};});
 await test('Adaptive profile can run twice without dropping the second result',async()=>{const m=await execute();check(m.data.metadata.energy.profile==='conservative','Repeated profile lost');return{profile:m.data.metadata.energy.profile};});
 await test('Manual intent during presentation update unlocks the interface',async()=>{$('energy-opacity').value='50';$('energy-opacity').dispatchEvent(new w.Event('input',{bubbles:true}));$('energy-shadow').dispatchEvent(new w.PointerEvent('pointerdown',{button:0,isPrimary:true}));check(!$('energy-run').disabled,'UI stayed locked');check(!$('provenance').textContent,'Old result kept');await execute();});
 await test('Manual intent cancels a pending adaptive request, including unchanged bound',async()=>{changed('energy-profile','sensitive');$('energy-run').click();$('energy-shadow').dispatchEvent(new w.PointerEvent('pointerdown',{button:0,isPrimary:true}));const expected=['histogramLow','histogramHigh','shadow','highlight'].map(k=>Number($('energy-'+k).value));await wait(250);check($('energy-profile').value==='manual','Manual intent lost');check(!$('provenance').textContent,'Stale result accepted');check(expected.join(',')===['histogramLow','histogramHigh','shadow','highlight'].map(k=>Number($('energy-'+k).value)).join(','),'Stale adaptive values');const camera={...matrix};await execute();check(JSON.stringify(camera)===JSON.stringify(matrix),'Cancellation reload moved camera');return{values:expected};});
 await test('All classic and energy presets included in one backup',async()=>{for(const name of ['Energy test A','Energy test B']){$('energy-save').click();$('profile-name').value=name;$('save-profile-form').dispatchEvent(new w.Event('submit',{cancelable:true,bubbles:true}));$('backup-dialog').close();}blobs=[];$('export-settings').click();const settings=JSON.parse(await blobs.at(-1).text());check(settings.energy.profiles.some(p=>p.name==='Energy test A')&&settings.energy.profiles.some(p=>p.name==='Energy test B'),'Missing energy profiles');check(settings.profiles.some(p=>p.name==='Recette gris'),'Classic profiles lost');return{classic:settings.profiles.length,energy:settings.energy.profiles.length};});
 await test('Settings and sessions restore energy mode and both profile sets',async()=>{
 blobs=[];$('export-settings').click();const backup=blobs.at(-1),saved=JSON.parse(await backup.text());
 const upload=async(id,blob,name)=>{const dt=new w.DataTransfer();dt.items.add(new w.File([blob],name,{type:'application/json'}));$(id).files=dt.files;$(id).dispatchEvent(new w.Event('change',{bubbles:true}));};
 changed('ela-mode','classic');await upload('settings-file',backup,'SHERLOQ-reglages.json');await until(()=>$('import-dialog').open);$('confirm-import').click();check($('ela-mode').value==='energy','Mode not restored');check($('energy-profile').value===saved.energy.selected,'Selected profile not restored');
 blobs=[];$('save-session').click();const session=blobs.at(-1);changed('ela-mode','classic');await upload('load-session',session,'sherloq-session.json');await until(()=>$('ela-mode').value==='energy');check($('empty').hidden===false,'Session should not contain image');check($('energy-profile').value===saved.energy.selected,'Session profile lost');return{classic:saved.profiles.length,energy:saved.energy.profiles.length,mode:saved.preferences.elaMode};
 });
 await test('Drop on welcome and original pane loads and computes automatically',async()=>{
 const file=new w.File([await (await fetch('energy-panels.jpg')).arrayBuffer()],'energy-dropped.jpg',{type:'image/jpeg'});
 for(const id of ['empty','original-viewport']){const dt=new w.DataTransfer();dt.items.add(file);const ev=new w.DragEvent('drop',{bubbles:true,cancelable:true,dataTransfer:dt});$(id).dispatchEvent(ev);check(ev.defaultPrevented,'Browser navigation not prevented');await until(()=>$('provenance').textContent&&!$('energy-run').disabled);check($('file-info').textContent.includes('energy-dropped.jpg'),'Dropped file not loaded');check($('layer').value==='result','Drop did not show result');}return{targets:['welcome','original-pane'],automatic:true};
 });
 await test('Novelty highlights are global, geometry-neutral, and work without storage',async()=>{
 const runs=calls.filter(x=>x.action==='run').length,before=JSON.stringify(metadata()),camera={...matrix},rect=$('viewport').getBoundingClientRect().toJSON(),setItem=w.Storage.prototype.setItem;
 const marked=doc.querySelector('[data-new-feature=blue]'),late=doc.createElement('button');late.hidden=true;late.dataset.newFeature='green';late.textContent='test';$('app').append(late);
 try{w.Storage.prototype.setItem=function(){throw Error('Test: storage denied');};for(const enabled of [true,false]){$('highlight-new-features').checked=enabled;$('highlight-new-features').dispatchEvent(new w.Event('change',{bubbles:true}));check((w.getComputedStyle(marked).boxShadow!=='none')===enabled,'Existing marker');check((w.getComputedStyle(late).boxShadow!=='none')===enabled,'Future marker');check((w.getComputedStyle($('ela-mode')).boxShadow!=='none')===enabled,'Selected option marker');}check(calls.filter(x=>x.action==='run').length===runs,'Highlight reran analysis');check(JSON.stringify(metadata())===before,'Parameters/result changed');check(JSON.stringify(camera)===JSON.stringify(matrix),'Camera moved');check(JSON.stringify($('viewport').getBoundingClientRect().toJSON())===JSON.stringify(rect),'Layout changed');return{withoutStorage:true,immediate:true};}finally{w.Storage.prototype.setItem=setItem;late.remove();}
 });
 }catch(e){proof.error=e.message;}finally{w.Worker.prototype.postMessage=post;w.URL.createObjectURL=create;w.HTMLAnchorElement.prototype.click=anchor;ctx.drawImage=draw;proof.pass=proof.tests.every(x=>x.pass)&&!proof.error;out.textContent=JSON.stringify(proof,null,2);out.before(Object.assign(document.createElement('p'),{textContent:(proof.pass?'PASS':'FAIL')+' · '+proof.tests.length+' checks'+(proof.error?' · '+proof.error:'')}));save.hidden=false;save.href=URL.createObjectURL(new Blob([out.textContent],{type:'application/json'}));save.download='SHERLOQ-energy-ui-proof.json';run.disabled=false;}
};
</script>
