<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="icons/favicon.svg" type="image/svg+xml"><title>SHERLOQ · Loupe</title><link rel="stylesheet" href="renderer.css"></head>
<body>
<main id="view"><canvas id="base"></canvas></main>
<header id="bar"><img class="app-icon" src="icons/favicon.svg" alt=""><strong class="brand">SHERLOQ</strong><output id="status" aria-live="polite"></output><button id="loupe-toggle" aria-pressed="true">Loupe · L</button><button id="settings">R</button><button id="web">Web</button><button id="local">Local</button><button id="quick-help" class="icon-button" aria-label="Aide" title="Aide">?</button><button id="options">⚙</button><button id="theme" class="icon-button" aria-label="Thème">◐</button><button id="language" class="theme-button" aria-label="Langue">EN</button><label id="choose">Ouvrir…<input id="file" type="file" accept="image/*,application/pdf,.pdf"></label></header>
<aside id="pdf-images" hidden aria-label="Images du PDF"></aside>
<aside id="panel" class="loupe-sidebar" hidden aria-labelledby="panel-title"><header><img class="app-icon" src="icons/favicon.svg" alt=""><h2 id="panel-title">Réglages de la loupe</h2><button id="restart" class="icon-button" aria-label="Redémarrer l’extension" title="Redémarrer l’extension">↻</button><button id="panel-close" class="icon-button" aria-label="Fermer">×</button></header>
<label id="preset-control"><span data-fr="Préréglage" data-en="Preset">Préréglage</span><select id="loupe-preset"><option value="default" data-fr="Par défaut" data-en="Default">Par défaut</option><option value="brush" data-fr="Détection du pinceau" data-en="Brush detection">Détection du pinceau</option><option value="brush2" data-fr="Détection du pinceau 2" data-en="Brush detection 2">Détection du pinceau 2</option><option value="histogram" data-fr="Égalisation de l’histogramme" data-en="Histogram equalization">Égalisation de l’histogramme</option><option value="custom" data-fr="Personnalisé" data-en="Custom" disabled>Personnalisé</option></select></label>
<details><summary data-fr="Grossissement et anneaux" data-en="Magnification and rings">Grossissement et anneaux</summary><div id="geometry"></div><button id="loupe-auto" type="button" data-fr="Taille automatique" data-en="Automatic size">Taille automatique</button><label id="navigation-control"><span data-fr="Navigation, loupe coupée" data-en="Navigation, magnifier off">Navigation, loupe coupée</span><select id="navigation-mode"><option value="auto" data-fr="Automatique" data-en="Automatic">Automatique</option><option value="mouse" data-fr="Souris" data-en="Mouse">Souris</option><option value="trackpad" data-fr="Trackpad" data-en="Trackpad">Trackpad</option></select></label></details>
<div id="effects"></div>
<details id="step-controls" open><summary data-fr="Réglage par touches" data-en="Keyboard adjustment">Réglage par touches</summary><label><span data-fr="Famille" data-en="Group">Famille</span><select id="control-group"></select></label><label><span data-fr="Paramètre" data-en="Parameter">Paramètre</span><select id="control-target"></select></label><label><span data-fr="Pas" data-en="Step">Pas</span><input id="control-step" type="number" min="1" max="255" step="1" value="10" required></label><label><span data-fr="Intervalle minimal (ms)" data-en="Minimum interval (ms)">Intervalle minimal (ms)</span><input id="control-interval" type="number" min="0" max="5000" step="10" value="100" required></label><div class="loupe-effect-actions"><button id="decrease" type="button">− · :</button><output id="control-value"></output><button id="increase" type="button">+ · =</button></div></details>
<div id="inspection"></div>
<p id="help" class="muted"></p></aside>
<script type="module" src="renderer.js"></script></body></html>
